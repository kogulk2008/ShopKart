<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="page-hero">
  <div class="container container-xl">
    <div class="search-hero glass">
      <span class="eyebrow-chip mb-3"><span class="dot"></span>Search &amp; Discover</span>
      <h1 class="mt-2 mb-3">Find exactly what you're looking for</h1>
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" class="form-control" id="productSearchInput" placeholder="Search for products, brands and categories...">
      </div>
    </div>
  </div>
</section>

<section class="section-pad pt-4">
  <div class="container container-xl">
    <div class="row g-4">
      <!-- Filters sidebar -->
      <div class="col-lg-3">
        <div class="filter-panel card-surface">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0"><i class="fa-solid fa-sliders me-2 text-cyan"></i>Filters</h5>
            <button class="btn btn-sk-ghost btn-sm" id="clearFiltersBtn">Clear</button>
          </div>

          <div class="filter-group">
            <h6>Category</h6>
            <div id="categoryFilterList"></div>
          </div>

          <div class="filter-group">
            <h6>Price</h6>
            <input type="range" class="form-range" min="200" max="90000" step="200" value="90000" id="priceRangeInput">
            <div class="d-flex justify-content-between text-mist small">
              <span>Up to</span>
              <span id="priceRangeVal">₹90,000</span>
            </div>
          </div>

          <div class="filter-group">
            <h6>Rating</h6>
            <div class="form-check mb-2"><input class="form-check-input rating-filter-cb" type="checkbox" value="4.5" id="r45"><label class="form-check-label" for="r45">4.5 &amp; above</label></div>
            <div class="form-check mb-2"><input class="form-check-input rating-filter-cb" type="checkbox" value="4" id="r4"><label class="form-check-label" for="r4">4.0 &amp; above</label></div>
            <div class="form-check mb-2"><input class="form-check-input rating-filter-cb" type="checkbox" value="3" id="r3"><label class="form-check-label" for="r3">3.0 &amp; above</label></div>
          </div>

          <div class="filter-group">
            <h6>Availability</h6>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="availabilityFilterCb">
              <label class="form-check-label" for="availabilityFilterCb">In stock only</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <span class="text-mist" id="resultsCount">Loading products...</span>
          <div class="d-flex align-items-center gap-2">
            <label class="text-mist small mb-0">Sort by:</label>
            <select class="form-select" id="sortSelect" style="width:auto;">
              <option value="popular">Popular</option>
              <option value="newest">Newest</option>
              <option value="price-low">Price: Low → High</option>
              <option value="price-high">Price: High → Low</option>
              <option value="rating">Rating</option>
            </select>
          </div>
        </div>
        <div class="row g-4" id="productsGrid"></div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
