<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="section-pad">
  <div class="container container-xl">
    <div class="dash-layout">
      <div id="dashSidebarPlaceholder"></div>
      <div class="dash-content">
        <h1 class="mb-1">My Profile</h1>
        <p class="text-mist mb-4">Manage your personal information and preferences.</p>

        <div class="card-surface p-4 mb-4">
          <h5 class="mb-3"><i class="fa-solid fa-id-card text-cyan me-2"></i>Personal Information</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Full Name</label>
              <div class="fw-semibold" id="pfName">-</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <div class="fw-semibold" id="pfEmail">-</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Phone</label>
              <div class="fw-semibold" id="pfPhone">-</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Account Type</label>
              <div class="fw-semibold text-capitalize" id="pfRole">-</div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Member Since</label>
              <div class="fw-semibold" id="pfJoined">-</div>
            </div>
          </div>
        </div>

        <div class="card-surface p-4 mb-4" id="addresses">
          <h5 class="mb-3"><i class="fa-solid fa-location-dot text-cyan me-2"></i>Saved Addresses</h5>
          <div id="pfAddressList"></div>
        </div>

        <div class="card-surface p-4" id="settings">
          <h5 class="mb-3"><i class="fa-solid fa-gear text-cyan me-2"></i>Settings</h5>
          <p class="text-mist small mb-3">This is a frontend demo — settings changes are for illustration only.</p>
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="notifSwitch" checked>
            <label class="form-check-label" for="notifSwitch">Email me about deals and offers</label>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="orderUpdateSwitch" checked>
            <label class="form-check-label" for="orderUpdateSwitch">SMS updates for order status</label>
          </div>
          <button class="btn btn-sk-danger" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</button>
        </div>

      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-sidebar.js"></script>
<script>
  function renderProfilePage(){
    if(!requireAuth()) return;
    const user = getCurrentUser();
    if(!user) return;
    document.getElementById('pfName').textContent = user.name;
    document.getElementById('pfEmail').textContent = user.email;
    document.getElementById('pfPhone').textContent = user.phone || '-';
    document.getElementById('pfRole').textContent = user.role;
    document.getElementById('pfJoined').textContent = new Date(user.joined).toLocaleDateString('en-IN', { year:'numeric', month:'long', day:'numeric' });

    const addrList = document.getElementById('pfAddressList');
    const addresses = user.addresses || [];
    addrList.innerHTML = addresses.length
      ? addresses.map(a => `<div class="p-3 mb-2 rounded-3" style="background:rgba(255,255,255,0.04);">
          <strong>${a.name}</strong> · ${a.phone}<br>
          <span class="text-mist">${a.line}, ${a.city}, ${a.state} - ${a.pin}</span>
        </div>`).join('')
      : `<div class="empty-mini"><i class="fa-solid fa-location-dot"></i>No saved addresses yet. Addresses you add during checkout will appear here.</div>`;
  }
  onDataReady(renderProfilePage);
</script>
</body>
</html>
