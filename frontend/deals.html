<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deals — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="page-hero">
  <div class="container container-xl">
    <div class="deal-banner">
      <div class="row align-items-center g-4">
        <div class="col-lg-7">
          <span class="eyebrow-chip mb-3"><span class="dot"></span>Flash Deals</span>
          <h2 class="mt-2">Weekend Mega Sale — Up to 60% OFF</h2>
          <p class="text-mist mb-0">Deep discounts across Electronics, Fashion, Home &amp; more. While stocks last.</p>
        </div>
        <div class="col-lg-5">
          <div class="text-mist mb-2">Deal ends in</div>
          <div class="countdown" id="dealsCountdown"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section-pad">
  <div class="container container-xl">
    <div class="section-heading">
      <div>
        <span class="eyebrow-chip"><span class="dot"></span>Biggest discounts</span>
        <h2 class="mt-2">Top Deals of the Day</h2>
      </div>
    </div>
    <div class="row g-4" id="dealsGrid"></div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
<script>
  onDataReady(() => {
    const deals = getProducts().filter(p => p.discount >= 30).sort((a,b) => b.discount - a.discount);
    renderProductGrid(document.getElementById('dealsGrid'), deals, 'No active deals right now — check back soon!');
    startCountdown('dealsCountdown', 8);
  });
</script>
</body>
</html>
