<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="section-pad">
  <div class="container container-xl">
    <div class="dash-layout">
      <div id="dashSidebarPlaceholder"></div>
      <div class="dash-content">
        <h1 class="mb-1">My Orders</h1>
        <p class="text-mist mb-4">Track and review your past purchases.</p>
        <div id="ordersList"></div>
        <div class="empty-state card-surface" id="ordersEmptyState" style="display:none;">
          <i class="fa-solid fa-box-open"></i>
          <h4>No orders yet</h4>
          <p class="text-mist">Your placed orders will show up here.</p>
          <a href="products.html" class="btn btn-sk-primary mt-2">Start Shopping</a>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>
<script src="js/dashboard-sidebar.js"></script>
<script>
  const ORDER_STEPS = ['Ordered', 'Packed', 'Shipped', 'Delivered'];

  function trackBarHTML(status){
    const currentIdx = ORDER_STEPS.indexOf(status);
    return `<div class="track-bar">${ORDER_STEPS.map((s, i) => `
      <div class="tb-step ${i <= currentIdx ? 'done' : ''}">
        <div class="tb-line"></div>
        <div class="tb-dot"><i class="fa-solid ${i <= currentIdx ? 'fa-check' : 'fa-circle'}" style="font-size:${i<=currentIdx?'.6rem':'.35rem'};"></i></div>
        <small>${s}</small>
      </div>`).join('')}</div>`;
  }

  async function renderOrdersPage(){
    if(!requireAuth()) return;
    const orders = await getOrdersFromAPI();
    const listEl = document.getElementById('ordersList');
    const emptyEl = document.getElementById('ordersEmptyState');
    if(!orders.length){
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    listEl.innerHTML = orders.map(o => `
      <div class="order-card card-surface">
        <div class="d-flex justify-content-between flex-wrap gap-2 mb-2">
          <div>
            <div class="fw-semibold">Order #${o.id}</div>
            <div class="text-mist-dim small">${new Date(o.date).toLocaleString('en-IN')}</div>
          </div>
          <div class="text-end">
            <span class="status-badge status-${o.status}">${o.status}</span>
            <div class="fw-bold mt-1">₹${o.totals.total.toLocaleString('en-IN')}</div>
          </div>
        </div>
        <div class="d-flex flex-wrap gap-3 mb-2">
          ${o.items.map(it => `
            <div class="d-flex align-items-center gap-2">
              <img src="${it.image}" style="width:40px;height:40px;object-fit:contain;background:var(--sk-navy-800);border-radius:8px;padding:4px;">
              <span class="small text-mist">${it.name} × ${it.qty}</span>
            </div>`).join('')}
        </div>
        ${trackBarHTML(o.status)}
      </div>
    `).join('');
  }

  onDataReady(renderOrdersPage);
</script>
</body>
</html>
