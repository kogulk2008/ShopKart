<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="page-hero">
  <div class="container container-xl">
    <h1><i class="fa-regular fa-heart text-cyan me-2"></i>My Wishlist</h1>
    <p class="text-mist">Products you've saved for later.</p>
  </div>
</section>

<section class="section-pad pt-2">
  <div class="container container-xl">
    <div class="row g-4" id="wishlistGrid"></div>
    <div class="empty-state card-surface" id="wishlistEmptyState" style="display:none;">
      <i class="fa-regular fa-heart"></i>
      <h4>Your wishlist is empty</h4>
      <p class="text-mist">Tap the heart icon on any product to save it here.</p>
      <a href="products.html" class="btn btn-sk-primary mt-2">Browse Products</a>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
<script>
  onDataReady(() => { requireAuth(); });
</script>
</body>
</html>
