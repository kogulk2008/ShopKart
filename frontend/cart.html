<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="page-hero">
  <div class="container container-xl">
    <h1><i class="fa-solid fa-cart-shopping text-cyan me-2"></i>Your Shopping Cart</h1>
    <p class="text-mist">Review your items before checking out.</p>
  </div>
</section>

<section class="section-pad pt-2">
  <div class="container container-xl">
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cartItemsList"></div>
        <div class="empty-state card-surface" id="cartEmptyState" style="display:none;">
          <i class="fa-solid fa-cart-shopping"></i>
          <h4>Your cart is empty</h4>
          <p class="text-mist">Looks like you haven't added anything yet.</p>
          <a href="products.html" class="btn btn-sk-primary mt-2">Start Shopping</a>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-surface p-4" id="cartSummaryBox" style="position:sticky; top:100px;">
          <h5 class="mb-3">Order Summary</h5>
          <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₹0</span></div>
          <div class="summary-row"><span>Discount</span><span id="sumDiscount" class="text-mint">- ₹0</span></div>
          <div class="summary-row"><span>Delivery</span><span id="sumDelivery">FREE</span></div>
          <div class="summary-row total"><span>Total</span><span id="sumTotal">₹0</span></div>
          <a href="checkout.html" class="btn btn-sk-primary w-100 mt-3">Proceed to Checkout <i class="fa-solid fa-arrow-right ms-1"></i></a>
          <a href="products.html" class="btn btn-sk-ghost w-100 mt-2">Continue Shopping</a>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
</body>
</html>
