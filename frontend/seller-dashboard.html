<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard — ShopKart</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-placeholder"></div>

<section class="section-pad" id="sellerDashboard">
  <div class="container container-xl">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h1 class="mb-1"><i class="fa-solid fa-store text-cyan me-2"></i>Seller Dashboard</h1>
        <p class="text-mist mb-0">Manage your products, track orders and monitor sales.</p>
      </div>
      <button class="btn btn-sk-primary" id="addProductBtn"><i class="fa-solid fa-plus me-2"></i>Add Product</button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card card-surface">
          <div class="text-mist small mb-1"><i class="fa-solid fa-box me-1"></i>Total Products</div>
          <div class="num" id="statTotalProducts">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card card-surface">
          <div class="text-mist small mb-1"><i class="fa-solid fa-receipt me-1"></i>Total Orders</div>
          <div class="num" id="statTotalOrders">0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card card-surface">
          <div class="text-mist small mb-1"><i class="fa-solid fa-indian-rupee-sign me-1"></i>Total Sales</div>
          <div class="num" id="statTotalSales">₹0</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card card-surface">
          <div class="text-mist small mb-1"><i class="fa-solid fa-triangle-exclamation me-1"></i>Out of Stock</div>
          <div class="num" id="statOutOfStock">0</div>
        </div>
      </div>
    </div>

    <ul class="nav pd-tabs mb-3" id="sellerTabs">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#sellerTabProducts">My Products</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#sellerTabOrders">Orders</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="sellerTabProducts">
        <div class="card-surface p-3">
          <div class="table-responsive">
            <table class="table table-sk align-middle mb-0">
              <thead>
                <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Actions</th></tr>
              </thead>
              <tbody id="sellerProductsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="tab-pane fade" id="sellerTabOrders">
        <div id="sellerOrdersList"></div>
      </div>
    </div>

  </div>
</section>

<!-- Add/Edit Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content glass card-surface">
      <div class="modal-header" style="border-bottom-color: var(--sk-glass-border);">
        <h5 class="modal-title" id="productModalTitle">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="productForm">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Product Name</label>
              <input type="text" class="form-control" id="productName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" id="productCategorySelect" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Price (₹)</label>
              <input type="number" class="form-control" id="productPrice" min="1" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Original Price (₹)</label>
              <input type="number" class="form-control" id="productOriginalPrice" min="1">
            </div>
            <div class="col-md-4">
              <label class="form-label">Stock</label>
              <input type="number" class="form-control" id="productStock" min="0" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Rating (0–5)</label>
              <input type="number" class="form-control" id="productRating" min="0" max="5" step="0.1" value="4.2">
            </div>
            <div class="col-md-6">
              <label class="form-label">Product Image</label>
              <input type="file" accept="image/*" class="form-control" id="productImageInput">
            </div>
            <div class="col-12 d-none" id="imagePreviewWrap">
              <img id="imagePreview" src="" style="width:90px;height:90px;object-fit:contain;background:var(--sk-navy-800);border-radius:12px;padding:6px;">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="productDescription" rows="3" required></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-top-color: var(--sk-glass-border);">
          <button type="button" class="btn btn-sk-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-sk-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>
<script src="js/search.js"></script>
<script src="js/seller.js"></script>

</body>
</html>
